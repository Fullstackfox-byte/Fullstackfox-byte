name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # allows manual run from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch GitHub Stats card
        run: |
          curl -sfL "https://github-readme-stats.vercel.app/api?username=Fullstackfox-byte&show_icons=true&count_private=true&theme=tokyonight&hide_border=true" -o assets/stats.svg

      - name: Fetch Top Languages card
        run: |
          curl -sfL "https://github-readme-stats.vercel.app/api/top-langs/?username=Fullstackfox-byte&layout=compact&theme=tokyonight&hide_border=true" -o assets/top-langs.svg

      - name: Fetch Streak card
        run: |
          curl -sfL "https://streak-stats.demolab.com?user=Fullstackfox-byte&theme=tokyonight&hide_border=true" -o assets/streak.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub stats SVGs" && git push)
